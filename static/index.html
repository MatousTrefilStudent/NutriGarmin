<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGarmin / FitNutri Sync</title>
    <!-- Zde by se v budoucnu vložil odkaz na Tailwind CSS a Chart.js -->
</head>
<body>
    <header>
        <h1>NUTRICONNECT / FITNUTRI SYNC</h1>
        <button>Profil</button>
        <button>Synchronizovat</button>
    </header>

    <main>
        <h2>DENNÍ PŘEHLED</h2>
        
        <section id="energeticka-bilance">
            <h3>ENERGETICKÁ BILANCE</h3>
            <p>Příjem (Jídlo): <span id="prijem">0</span> kcal</p>
            <p>Výdej (Garmin): <span id="vydej">0</span> kcal</p>
            <h4>BILANCE: <span id="bilance">0</span> kcal</h4>
        </section>

        <section id="makroziviny">
            <h3>MAKROŽIVINY</h3>
            <!-- Zde se později pomocí Chart.js vykreslí grafy -->
            <p>Bílkoviny: 0/150 g</p>
            <p>Sacharidy: 0/220 g</p>
            <p>Tuky: 0/70 g</p>
        </section>
    </main>
</body>
</html>
