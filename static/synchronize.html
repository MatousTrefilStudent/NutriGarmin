<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7f5">
    <title>Synchronizace Garmin | NutriConnect</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="topbar">
        <p class="brand">NUTRICONNECT</p>
        <a class="back-link" href="/">Zpět na přehled</a>
    </header>

    <main>
        <p class="eyebrow">Garmin Connect</p>
        <h2>Synchronizace aktivit</h2>
        <p class="intro">
            Zadejte přihlašovací údaje ke Garmin Connect a období, za které chcete aktivity načíst.
        </p>

        <section class="card" aria-label="Přihlašovací údaje a období synchronizace">
            <form id="garmin-sync-form">
                <div class="field">
                    <label for="garmin-email">E-mail ke Garmin Connect</label>
                    <input
                        id="garmin-email"
                        name="email"
                        type="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="field">
                    <label for="garmin-password">Heslo</label>
                    <input
                        id="garmin-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <fieldset class="date-range">
                    <legend>Období aktivit</legend>
                    <div class="field">
                        <label for="date-start">Od</label>
                        <input id="date-start" name="date_start" type="date" required>
                    </div>
                    <div class="field">
                        <label for="date-end">Do</label>
                        <input id="date-end" name="date_end" type="date" required>
                    </div>
                </fieldset>

                <p class="hint">
                    Přihlašovací údaje slouží výhradně k jednorázovému načtení aktivit z vašeho účtu Garmin Connect a neukládají se.
                </p>
                <button class="submit-button" id="sync-button" type="submit">
                    <span id="button-label">Synchronizovat aktivity</span>
                    <span class="spinner" id="button-spinner" aria-hidden="true" hidden></span>
                </button>
                <p class="notice" id="sync-status" role="status" aria-live="polite" hidden></p>
            </form>
        </section>
    </main>

    <script>
        const form = document.querySelector("#garmin-sync-form");
        const status = document.querySelector("#sync-status");
        const syncButton = document.querySelector("#sync-button");
        const buttonLabel = document.querySelector("#button-label");
        const buttonSpinner = document.querySelector("#button-spinner");
        const dateStartInput = document.querySelector("#date-start");
        const dateEndInput = document.querySelector("#date-end");

        // Nastavení výchozích dat, pokud nejsou vyplněna: konec = dnes, začátek = před 7 dny
        const today = new Date();
        const weekAgo = new Date();
        weekAgo.setDate(today.getDate() - 7);

        const formatDate = (d) => d.toISOString().split("T")[0];

        if (!dateEndInput.value) {
            dateEndInput.value = formatDate(today);
        }
        if (!dateStartInput.value) {
            dateStartInput.value = formatDate(weekAgo);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.querySelector("#garmin-email").value.trim();
            const password = document.querySelector("#garmin-password").value;
            const date_start = dateStartInput.value;
            const date_end = dateEndInput.value;

            if (!email || !password || !date_start || !date_end) {
                status.textContent = "Vyplňte prosím všechna povinná pole.";
                status.className = "notice notice-error";
                status.hidden = false;
                return;
            }

            if (date_start > date_end) {
                status.textContent = "Počáteční datum nesmí být novější než koncové datum.";
                status.className = "notice notice-error";
                status.hidden = false;
                return;
            }

            // Indikace načítání
            syncButton.disabled = true;
            buttonSpinner.hidden = false;
            buttonLabel.textContent = "Probíhá synchronizace...";
            status.textContent = "Připojování ke Garmin Connect a stahování aktivit. Může to chvíli trvat...";
            status.className = "notice";
            status.hidden = false;

            try {
                const response = await fetch("/api/garmin/sync", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        date_start: date_start,
                        date_end: date_end
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || `Chyba serveru (${response.status})`);
                }

                status.innerHTML = `Synchronizace byla úspěšná! Do databáze bylo uloženo <strong>${data.count}</strong> aktivit. <a href="/" style="text-decoration: underline; font-weight: bold; margin-left: 0.5rem;">Zpět na přehled &rarr;</a>`;
                status.className = "notice notice-success";
            } catch (error) {
                status.textContent = `Synchronizace se nezdařila: ${error.message}`;
                status.className = "notice notice-error";
            } finally {
                syncButton.disabled = false;
                buttonSpinner.hidden = true;
                buttonLabel.textContent = "Synchronizovat aktivity";
            }
        });
    </script>
</body>
</html>
